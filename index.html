<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLJPY实验性首页</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(140, 149, 159, 0.15);
      text-align: center;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white;
      font-size: 36px;
      line-height: 80px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      color: #57606a;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #2ea44f;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">🚀</div>

    <p><a href="https://xrpthomasanderson.github.io/RLJPY/book.html" class="btn" target="_blank">前往 订单簿</a></p>
    <p><a href="https://github.com/xrpThomasAnderson/RLJPY" class="btn" target="_blank">前往 GitHub</a></p>
  </div>

</body>
</html>
