<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLJPY订单簿</title>
  <!-- 1. 在 head 中提前发起请求，返回完整的 JSON 对象 -->
  <script>
        const AppConfigPromise = fetch('https://xrpthomasanderson.github.io/RLJPY/config.json')
            .then(res => {
                if (!res.ok) throw new Error("加载 config.json 失败");
                return res.json(); // 返回完整的 JSON 对象
            })
            .catch(err => {
                console.warn("加载配置文件失败，启用后备默认配置:", err);
                // 必须返回一个对象，包含所有你后续可能会用到的字段，防止报错
                return {
                    xrplNode: "wss://xrplcluster.com"
                    // 其他你需要的字段也可以写在这里
                };
            });
  </script>
  <script src="https://unpkg.com/xrpl@2.14.0/build/xrpl-latest-min.js" integrity="sha384-J7PqxLCqaHM/pbIDWeW/yXzoVfDsXFxA6Y1uyZ9dQBN1OJ2OCDVcxa82moQX9ecX" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #131722; 
      color: #d1d4dc;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      color: #fff;
      font-size: 24px;
      margin-bottom: 20px;
    }
    
    .main-wrapper {
      width: 100%;
      max-width: 1280px; 
      margin: 0 auto;
    }

    /* 🌟 控制输入区域 (手机端默认上下两排排列) */
    .config-card {
      background: #1e222d;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column; 
      gap: 20px; /* 间距与下方盘口的 gap 一致 */
      width: 100%; 
    }
    
    /* 🌟 左右区域容器 */
    .config-half {
      display: flex;
      width: 100%;
    }

    /* 左侧 (发行方) */
    .form-group-issuer {
      width: 100%; 
    }

    /* 右侧内部布局 (代币 + 按钮) */
    .right-half {
      display: flex;
      gap: 15px;
      align-items: flex-end; /* 底部对齐 */
    }

    .form-group-currency {
      flex: 1; /* 占据右半区剩余的所有空间 */
      min-width: 0; 
    }
    
    /* 🌟 电脑端 (宽度 > 768px) 严格按照 50% : 50% 对齐下面盘口 */
    @media (min-width: 768px) {
      .config-card {
        flex-direction: row; 
      }
      .config-half {
        flex: 1; /* 左右各占一半 */
      }
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #8b93a6;
      white-space: nowrap;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      background: #2a2e39;
      border: 1px solid #363c4e;
      color: #fff;
      border-radius: 4px;
      font-family: monospace;
      outline: none;
    }
    
    .form-group input:focus {
      border-color: #2962ff;
    }

    button {
      background-color: #2962ff;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      height: 38px;
      transition: background 0.2s;
      white-space: nowrap; 
      flex-shrink: 0; /* 确保按钮不会被太长的代币代码挤压变形 */
    }
    
    button:hover { background-color: #1e4bd8; }
    button:disabled { background-color: #363c4e; cursor: not-allowed; }

    .orderbook-container {
      display: flex;
      flex-wrap: wrap; 
      gap: 20px;
      width: 100%; 
    }
    
    .book-panel {
      flex: 1 1 480px; 
      background: #1e222d;
      border-radius: 8px;
      padding: 15px 15px;
      overflow-x: auto; 
    }
    
    .book-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #363c4e;
    }
    .title-buy { color: #0ecb81; }
    .title-sell { color: #f6465d; }
    
    table {
      width: 100%;
      min-width: 100%; 
      table-layout: fixed; 
      border-collapse: collapse;
      font-size: 12px; 
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    
    th:nth-child(1) { width: 50%; } 
    th:nth-child(2) { width: 50%; } 

    th {
      text-align: right;
      color: #8b93a6;
      font-weight: normal;
      padding: 5px 0 10px 0;
      white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; }
    td {
      padding: 6px 0;
      text-align: right;
      white-space: nowrap;
    }
    .row-buy td:nth-child(2) { color: #0ecb81; } 
    .row-sell td:nth-child(2) { color: #f6465d; } 
    
    .my-order {
      background-color: rgba(41, 98, 255, 0.15);
      border-radius: 4px;
    }
    .my-order td {
      font-weight: bold;
    }
    .my-order td:first-child::before {
      content: "👉 ";
    }
    
    .loading {
      text-align: center;
      color: #8b93a6;
      padding: 20px;
      font-style: italic;
    }
    .btn {
      display: inline-block;
      background-color: #2ea44f;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2c974b;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <div class="config-card">
      <!-- 🔴 左半部分 (对应下方卖单盘口宽度) -->
      <div class="config-half">
        <div class="form-group form-group-issuer">
          <label>发行方 (Issuer)</label>
          <input type="text" id="issuerAddress" value="rsad8VRXdY5m8UYTSs4zrKG6Noy8UjfoSZ">
        </div>
      </div>
      
      <!-- 🟢 右半部分 (对应下方买单盘口宽度) -->
      <div class="config-half right-half">
        <div class="form-group form-group-currency">
          <label>代币代码 (Currency)</label>
          <input type="text" id="currencyCode" value="RLJPY">
        </div>
        <div class="form-group form-group-address" style="display: none;">
          <label>你的地址 (用于高亮标记)</label>
          <input type="text" id="myAddress" value="">
        </div>
        <button id="refreshBtn" onclick="fetchOrderBook()">刷新盘口</button>
      </div>
    </div>

    <div class="orderbook-container">
        <!-- 🔴 卖单盘口 (左侧) -->
      <div class="book-panel">
        <div class="book-title title-sell">卖单盘口 (Asks)</div>
        <table>
          <thead>
            <tr>
              <th>单价 (XRP)</th>
              <th>数量 (<span class="dynamic-currency">RLJPY</span>)</th>
            </tr>
          </thead>
          <tbody id="sellBody">
            <tr><td colspan="2" class="loading">正在加载数据...</td></tr>
          </tbody>
        </table>
      </div>
      
        <!-- 🟢 买单盘口 (右侧) -->
      <div class="book-panel">
        <div class="book-title title-buy">买单盘口 (Bids)</div>
        <table>
          <thead>
            <tr>
              <th>单价 (XRP)</th>
              <th>数量 (<span class="dynamic-currency">RLJPY</span>)</th>
            </tr>
          </thead>
          <tbody id="buyBody">
            <tr><td colspan="2" class="loading">正在加载数据...</td></tr>
          </tbody>
        </table>
      </div>
      
    </div>

    <p style="text-align: center; margin-top: 20px;"><a href="https://xrpthomasanderson.github.io/RLJPY/" class="btn">首页</a></p>
  </div>

  <script>
    function formatCurrencyCode(code) {
      if (code.length === 3) return code;
      let hex = '';
      for (let i = 0; i < code.length; i++) {
        hex += code.charCodeAt(i).toString(16).padStart(2, '0');
      }
      return hex.toUpperCase().padEnd(40, "0");
    }

    function shortAddress(address) {
      if (!address) return "";
      return address.substring(0, 5) + "..." + address.substring(address.length - 4);
    }

    function formatNumber(num, decimals = 2) {
      const n = Number(num);
      return isNaN(n) ? "0.00" : n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    async function fetchOrderBook() {
      const btn = document.getElementById("refreshBtn");
      btn.disabled = true;
      btn.innerText = "加载中...";
      
      document.getElementById("buyBody").innerHTML = '<tr><td colspan="2" class="loading">正在连接节点...</td></tr>';
      document.getElementById("sellBody").innerHTML = '<tr><td colspan="2" class="loading">正在连接节点...</td></tr>';

      const rawCurrency = document.getElementById("currencyCode").value.trim();
      const issuer = document.getElementById("issuerAddress").value.trim();
      const myAddress = document.getElementById("myAddress").value.trim();
      
      const currencyLabels = document.querySelectorAll(".dynamic-currency");
      currencyLabels.forEach(label => {
        label.innerText = rawCurrency || "Token"; 
      });

      const currencyHex = formatCurrencyCode(rawCurrency);
      // 等待 Promise 解析完成，拿到完整的 config 对象
      const config = await AppConfigPromise;
      const client = new xrpl.Client(config.xrplNode);
      
      try {
        await client.connect();

        const sellResponse = await client.request({
          command: "book_offers",
          taker_gets: { currency: currencyHex, issuer: issuer },
          taker_pays: { currency: "XRP" },
          limit: 30
        });

        const buyResponse = await client.request({
          command: "book_offers",
          taker_gets: { currency: "XRP" },
          taker_pays: { currency: currencyHex, issuer: issuer },
          limit: 30
        });

        renderBook(buyResponse.result.offers, "buyBody", myAddress, "buy");
        renderBook(sellResponse.result.offers, "sellBody", myAddress, "sell");

      } catch (error) {
        console.error(error);
        alert("获取盘口失败: " + error.message);
      } finally {
        await client.disconnect();
        btn.disabled = false;
        btn.innerText = "刷新盘口";
      }
    }

    function renderBook(offers, tbodyId, myAddress, type) {
      const tbody = document.getElementById(tbodyId);
      tbody.innerHTML = "";

      if (!offers || offers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" class="loading">暂无挂单</td></tr>`;
        return;
      }

      offers.forEach(o => {
        let tokenAmount, xrpAmount, price;
        const isMine = o.Account === myAddress;

        if (type === "sell") {
          tokenAmount = Number(o.TakerGets.value || o.TakerGets);
          xrpAmount = Number(o.TakerPays) / 1000000;
        } else {
          xrpAmount = Number(o.TakerGets) / 1000000;
          tokenAmount = Number(o.TakerPays.value || o.TakerPays);
        }

        price = xrpAmount / tokenAmount;

        const tr = document.createElement("tr");
        tr.className = `row-${type} ${isMine ? 'my-order' : ''}`;
        
        tr.innerHTML = `
          <td>${price.toFixed(14)}</td> 
          <td>${formatNumber(tokenAmount, 2)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.onload = function() {
      fetchOrderBook();
    };
  </script>
</body>
</html>
